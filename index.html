<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Training" />
<meta name="theme-color" content="#0c0a09" />
<link rel="apple-touch-icon" sizes="180x180" href="icon.png" />
<link rel="apple-touch-icon" sizes="120x120" href="icon-120.png" />
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png" />
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<title>Training Log</title>
<style>
  :root {
    --bg: #0c0a09;
    --bg-2: #15110f;
    --panel: #1c1714;
    --panel-2: #241d19;
    --border: #3a2f28;
    --border-soft: #2a2320;
    --text: #f5efe6;
    --text-dim: #a89b8a;
    --gold: #d4af37;
    --gold-soft: #b8962e;
    --sapphire: #0f52ba;
    --sapphire-soft: #0a3d8f;
    --sapphire-glow: #2e7de0;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  body {
    background:
      radial-gradient(1200px 400px at 50% -200px, rgba(212,175,55,0.08), transparent 60%),
      radial-gradient(800px 300px at 100% 100%, rgba(15,82,186,0.08), transparent 60%),
      var(--bg);
    padding: 18px 14px 60px;
    max-width: 560px;
    margin: 0 auto;
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    margin: 0 0 4px;
    color: var(--gold);
    letter-spacing: 0.5px;
    text-align: center;
  }
  .sub {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 18px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.35);
  }
  .panel h2 {
    font-family: Georgia, serif;
    font-size: 16px;
    margin: 0 0 10px;
    color: var(--gold);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel h2::before {
    content: "";
    width: 6px; height: 6px;
    background: var(--sapphire);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--sapphire-glow);
  }
  .panel.previous h2 {
    color: var(--sapphire-glow);
    font-style: italic;
  }
  .panel.previous h2::before {
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }
  .panel.previous {
    border-color: var(--sapphire-soft);
    opacity: 0.92;
  }

  textarea, input, select {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--border-soft);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus, input:focus, select:focus {
    border-color: var(--gold-soft);
  }
  textarea { resize: vertical; min-height: 50px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    border-bottom: 1px solid var(--border-soft);
    padding: 6px 4px;
    text-align: left;
    vertical-align: middle;
  }
  th {
    color: var(--gold);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  td input {
    padding: 5px 6px;
    font-size: 13px;
  }
  td.day-label {
    color: var(--text-dim);
    font-weight: 600;
    width: 40px;
    font-size: 12px;
  }
  td.day-label.today {
    color: var(--sapphire-glow);
  }

  .workout-row {
    display: grid;
    grid-template-columns: 1.5fr 0.8fr 0.8fr auto;
    gap: 5px;
    margin-bottom: 6px;
    align-items: center;
  }
  .workout-row input {
    padding: 6px 7px;
    font-size: 13px;
  }
  .workout-head {
    display: grid;
    grid-template-columns: 1.5fr 0.8fr 0.8fr auto;
    gap: 5px;
    margin-bottom: 6px;
    font-size: 10px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .workout-head span:last-child { width: 26px; }

  .panel.previous .workout-row input {
    background: rgba(15,82,186,0.06);
    border-color: var(--sapphire-soft);
    color: var(--text-dim);
  }
  .panel.previous .workout-head {
    color: var(--sapphire-glow);
  }

  .btn-x {
    background: transparent;
    border: 1px solid var(--sapphire-soft);
    color: var(--sapphire-glow);
    border-radius: 6px;
    width: 26px; height: 26px;
    font-size: 14px;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-x:active { background: var(--sapphire-soft); color: white; }

  .btn-add {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--gold-soft);
    color: var(--gold);
    padding: 8px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 4px;
    font-family: inherit;
    letter-spacing: 0.5px;
  }
  .btn-add:active { background: rgba(212,175,55,0.1); }

  .panel.previous .btn-add {
    border-color: var(--sapphire-soft);
    color: var(--sapphire-glow);
  }
  .panel.previous .btn-add:active { background: rgba(15,82,186,0.15); }

  .date-pill {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 10px;
    padding: 4px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border-soft);
    border-radius: 20px;
    display: inline-block;
    margin-left: 50%;
    transform: translateX(-50%);
  }

  .section-divider {
    text-align: center;
    color: var(--text-dim);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin: 14px 0 10px;
    position: relative;
  }
  .section-divider::before, .section-divider::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 30%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
  }
  .section-divider::before { left: 0; }
  .section-divider::after { right: 0; }

  .archive-btn {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--sapphire-soft);
    color: var(--sapphire-glow);
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 6px 0 16px;
  }
  .archive-btn:active { background: var(--sapphire-soft); color: white; }

  .footer-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .footer-actions button {
    flex: 1;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .footer-actions button:active { background: var(--border); color: var(--gold); }

  .save-indicator {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(212,175,55,0.9);
    color: #0c0a09;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .save-indicator.show { opacity: 1; }

  .loading {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
    font-style: italic;
  }

  @media (max-width: 380px) {
    .workout-row, .workout-head {
      grid-template-columns: 1.3fr 0.8fr 0.9fr auto;
      gap: 4px;
    }
  }
</style>
</head>
<body>

<div class="save-indicator" id="saveIndicator">Saved</div>

<h1>Training Log</h1>
<div class="sub">— Iron & Intention —</div>

<div id="app" class="loading">Loading your data…</div>

<script>
// =========================
// STATE
// =========================
const STORAGE_KEY = "training-tracker-data";
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAY_NUMS = [1, 2, 3, 4, 5, 6];
const DAY_NAMES = {
  1: "Push A",
  2: "Pull A",
  3: "Legs",
  4: "Push B",
  5: "Pull B",
  6: "Skills"
};

function emptyExerciseList() {
  return [];
}

function defaultState() {
  return {
    goal: "",
    week: {
      Mon: { notes: "" },
      Tue: { notes: "" },
      Wed: { notes: "" },
      Thu: { notes: "" },
      Fri: { notes: "" },
      Sat: { notes: "" },
      Sun: { notes: "" },
    },
    // Current week's workouts — one list per day
    current: {
      1: [],
      2: [],
      3: [],
      4: [],
      5: [],
      6: [],
    },
    // Previous week's workouts — one list per day
    previous: {
      1: [],
      2: [],
      3: [],
      4: [],
      5: [],
      6: [],
    },
  };
}

let state = defaultState();
let saveTimer = null;

// =========================
// PERSISTENCE
// =========================
async function loadData() {
  try {
    if (window.storage) {
      const result = await window.storage.get(STORAGE_KEY);
      if (result && result.value) {
        state = mergeState(defaultState(), JSON.parse(result.value));
      }
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = mergeState(defaultState(), JSON.parse(raw));
    }
  } catch (e) {
    console.log("No saved data yet:", e);
  }
}

// Deep merge that preserves missing substructures
function mergeState(base, saved) {
  const out = { ...base, ...saved };
  out.week = { ...base.week, ...(saved.week || {}) };
  out.current = { ...base.current, ...(saved.current || {}) };
  out.previous = { ...base.previous, ...(saved.previous || {}) };
  return out;
}

async function saveData() {
  const indicator = document.getElementById("saveIndicator");
  try {
    const payload = JSON.stringify(state);
    if (window.storage) {
      await window.storage.set(STORAGE_KEY, payload);
    } else {
      localStorage.setItem(STORAGE_KEY, payload);
    }
    indicator.classList.add("show");
    setTimeout(() => indicator.classList.remove("show"), 900);
  } catch (e) {
    console.error("Save failed:", e);
  }
}

function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 400);
}

// =========================
// HELPERS
// =========================
function todayDayName() {
  const d = new Date();
  const idx = (d.getDay() + 6) % 7;
  return DAYS[idx];
}

function todayString() {
  return new Date().toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric"
  });
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (k === "value") node.value = v;
    else node.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

// =========================
// RENDER
// =========================
function render() {
  const app = document.getElementById("app");
  app.className = "";
  app.innerHTML = "";

  // ---- Goal panel ----
  const goalPanel = el("div", { class: "panel" });
  goalPanel.appendChild(el("h2", {}, "Yearly Goal"));
  const goalInput = el("textarea", {
    placeholder: "Write your 1–2 sentence training goal for the year…",
    oninput: (e) => { state.goal = e.target.value; queueSave(); }
  });
  goalInput.value = state.goal;
  goalPanel.appendChild(goalInput);
  app.appendChild(goalPanel);

  // ---- Today date pill ----
  app.appendChild(el("div", { class: "date-pill" }, todayString()));

  // ---- Weekly notes table ----
  const weekPanel = el("div", { class: "panel" });
  weekPanel.appendChild(el("h2", {}, "This Week"));
  const weekTable = el("table");
  const theadW = el("thead", {}, el("tr", {}, [
    el("th", {}, "Day"),
    el("th", {}, "Notes"),
  ]));
  weekTable.appendChild(theadW);
  const tbodyW = el("tbody");
  const today = todayDayName();
  DAYS.forEach(day => {
    const tr = el("tr");
    tr.appendChild(el("td", { class: "day-label" + (day === today ? " today" : "") }, day));
    const notesInput = el("input", {
      type: "text", placeholder: "workout + notes",
      value: day === "Sun" ? "Recovery Day" : state.week[day].notes,
      oninput: (e) => { if (day !== "Sun") { state.week[day].notes = e.target.value; queueSave(); } },
      readonly: day === "Sun"
    });
    tr.appendChild(el("td", {}, notesInput));
    tbodyW.appendChild(tr);
  });
  weekTable.appendChild(tbodyW);
  weekPanel.appendChild(weekTable);
  app.appendChild(weekPanel);

  // ---- Archive button ----
  const archiveBtn = el("button", {
    class: "archive-btn",
    onclick: archiveWeek
  }, "↻ Move Current → Previous Week");
  app.appendChild(archiveBtn);

  // ---- Day 1-6 panels, each with Current + Previous ----
  DAY_NUMS.forEach(n => {
    app.appendChild(el("div", { class: "section-divider" }, DAY_NAMES[n]));
    app.appendChild(renderWorkoutPanel({
      title: DAY_NAMES[n],
      exercises: state.current[n],
      previous: false,
      dayNum: n,
    }));
    app.appendChild(renderWorkoutPanel({
      title: DAY_NAMES[n] + " — Previous Week",
      exercises: state.previous[n],
      previous: true,
      dayNum: n,
    }));
  });

  // ---- Footer actions ----
  const footer = el("div", { class: "footer-actions" }, [
    el("button", { onclick: resetCurrent }, "Reset Current"),
    el("button", { onclick: exportData }, "Export"),
  ]);
  app.appendChild(footer);
}

function renderWorkoutPanel({ title, exercises, previous, dayNum }) {
  const panel = el("div", { class: "panel" + (previous ? " previous" : "") });
  panel.appendChild(el("h2", {}, title));

  const head = el("div", { class: "workout-head" }, [
    el("span", {}, "Exercise"),
    el("span", {}, "Weight"),
    el("span", {}, "Reps × Sets"),
    el("span", {}, ""),
  ]);
  panel.appendChild(head);

  exercises.forEach((ex, i) => {
    const row = el("div", { class: "workout-row" }, [
      el("input", {
        type: "text", placeholder: "e.g. Bench Press",
        value: ex.name,
        oninput: (e) => { ex.name = e.target.value; queueSave(); }
      }),
      el("input", {
        type: "text", inputmode: "decimal", placeholder: "lb",
        value: ex.weight,
        oninput: (e) => { ex.weight = e.target.value; queueSave(); }
      }),
      el("input", {
        type: "text", placeholder: "e.g. 8×3",
        value: ex.reps,
        oninput: (e) => { ex.reps = e.target.value; queueSave(); }
      }),
      el("button", {
        class: "btn-x",
        onclick: () => {
          exercises.splice(i, 1);
          queueSave();
          render();
        }
      }, "×"),
    ]);
    panel.appendChild(row);
  });

  const addBtn = el("button", {
    class: "btn-add",
    onclick: () => {
      exercises.push({ name: "", weight: "", reps: "" });
      queueSave();
      render();
    }
  }, "+ Add Exercise");
  panel.appendChild(addBtn);

  return panel;
}

// =========================
// ACTIONS
// =========================
function archiveWeek() {
  if (!confirm("Copy this week's workouts to Previous Week and clear the current entries? Your weekly notes will also reset.")) return;
  // Deep copy current into previous
  DAY_NUMS.forEach(n => {
    state.previous[n] = state.current[n].map(ex => ({ ...ex }));
    state.current[n] = [];
  });
  DAYS.forEach(d => { state.week[d] = { notes: "" }; });
  queueSave();
  render();
}

function resetCurrent() {
  if (!confirm("Clear this week's notes and all current Day 1/2/3 exercises? Previous Week stays intact.")) return;
  DAY_NUMS.forEach(n => { state.current[n] = []; });
  DAYS.forEach(d => { state.week[d] = { notes: "" }; });
  queueSave();
  render();
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "training-log-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

// =========================
// INIT
// =========================
(async function init() {
  await loadData();
  render();
})();
</script>
</body>
</html>
