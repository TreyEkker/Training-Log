<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Phases" />
<meta name="theme-color" content="#0c0a09" />
<title>Training Phases</title>
<style>
  :root {
    --bg: #0c0a09;
    --bg-2: #15110f;
    --panel: #1c1714;
    --panel-2: #241d19;
    --border: #3a2f28;
    --border-soft: #2a2320;
    --text: #f5efe6;
    --text-dim: #a89b8a;
    --gold: #d4af37;
    --gold-soft: #b8962e;
    --sapphire: #0f52ba;
    --sapphire-soft: #0a3d8f;
    --sapphire-glow: #2e7de0;
    --blue: #1e3a8a;
    --red: #7f1d1d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  body {
    background:
      radial-gradient(1200px 400px at 50% -200px, rgba(212,175,55,0.08), transparent 60%),
      radial-gradient(800px 300px at 100% 100%, rgba(15,82,186,0.08), transparent 60%),
      var(--bg);
    padding: 18px 14px 60px;
    max-width: 1200px;
    margin: 0 auto;
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    margin: 0 0 4px;
    color: var(--gold);
    letter-spacing: 0.5px;
    text-align: center;
  }
  .sub {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 18px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .phases-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }

  .phase-box {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.35);
  }

  .phase-box h2 {
    font-family: Georgia, serif;
    font-size: 18px;
    margin: 0 0 12px;
    color: var(--gold);
    letter-spacing: 0.5px;
    text-align: center;
  }

  .weeks-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .week-row {
    padding: 10px 12px;
    background: linear-gradient(135deg, #1e3a8a, #1e40af);
    border: 1px solid var(--sapphire-soft);
    border-radius: 6px;
    color: var(--text);
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: center;
    user-select: none;
  }

  .week-row:hover:not(.completed) {
    background: linear-gradient(135deg, #1e40af, #1e3a8a);
    border-color: var(--sapphire-glow);
    box-shadow: 0 0 8px rgba(46, 125, 224, 0.3);
  }

  .week-row:active {
    transform: scale(0.98);
  }

  .week-row.completed {
    background: linear-gradient(135deg, #7f1d1d, #991b1b);
    border-color: #dc2626;
    opacity: 0.4;
    cursor: default;
  }

  .footer-nav {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    justify-content: center;
  }

  .footer-nav button {
    flex: 1;
    max-width: 150px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: all 0.15s;
  }

  .footer-nav button:active {
    background: var(--border);
    color: var(--gold);
  }

  @media (max-width: 768px) {
    .phases-container {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<h1>Training Phases</h1>
<div class="sub">— Progress Tracker —</div>

<div id="app"></div>

<script>
// =========================
// STATE
// =========================
const STORAGE_KEY = "phases-tracker-data";
const PHASES = ["Phase 1", "Phase 2", "Phase 3", "Phase 4", "Phase 5", "Phase 6"];
const WEEKS_PER_PHASE = 8;

function defaultState() {
  const state = {};
  PHASES.forEach((phase, idx) => {
    state[idx + 1] = {};
    for (let w = 1; w <= WEEKS_PER_PHASE; w++) {
      state[idx + 1][w] = false; // false = not completed, true = completed
    }
  });
  return state;
}

let state = defaultState();

// =========================
// PERSISTENCE
// =========================
async function loadData() {
  try {
    if (window.storage) {
      const result = await window.storage.get(STORAGE_KEY);
      if (result && result.value) {
        state = JSON.parse(result.value);
      }
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = JSON.parse(raw);
    }
  } catch (e) {
    console.log("No saved data yet:", e);
  }
}

async function saveData() {
  try {
    const payload = JSON.stringify(state);
    if (window.storage) {
      await window.storage.set(STORAGE_KEY, payload);
    } else {
      localStorage.setItem(STORAGE_KEY, payload);
    }
  } catch (e) {
    console.error("Save failed:", e);
  }
}

// =========================
// HELPERS
// =========================
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (k === "value") node.value = v;
    else node.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

// =========================
// RENDER
// =========================
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  const container = el("div", { class: "phases-container" });

  PHASES.forEach((phaseName, phaseIdx) => {
    const phaseNum = phaseIdx + 1;
    const phaseBox = el("div", { class: "phase-box" });
    phaseBox.appendChild(el("h2", {}, phaseName));

    const weeksList = el("div", { class: "weeks-list" });

    for (let w = 1; w <= WEEKS_PER_PHASE; w++) {
      const isCompleted = state[phaseNum][w];
      const weekRow = el("div", {
        class: "week-row" + (isCompleted ? " completed" : ""),
        onclick: () => toggleWeek(phaseNum, w)
      }, `Week ${w}`);
      weeksList.appendChild(weekRow);
    }

    phaseBox.appendChild(weeksList);
    container.appendChild(phaseBox);
  });

  app.appendChild(container);

  // Footer navigation
  const footer = el("div", { class: "footer-nav" }, [
    el("button", { onclick: resetAll }, "Reset All"),
    el("button", { onclick: () => window.location.href = "index.html" }, "Training Log"),
  ]);
  app.appendChild(footer);
}

function toggleWeek(phaseNum, weekNum) {
  state[phaseNum][weekNum] = !state[phaseNum][weekNum];
  saveData();
  render();
}

function resetAll() {
  if (!confirm("Reset all phases to incomplete? This cannot be undone.")) return;
  state = defaultState();
  saveData();
  render();
}

// =========================
// INIT
// =========================
(async function init() {
  await loadData();
  render();
})();
</script>
</body>
</html>
